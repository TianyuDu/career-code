[project]
name = "career-code"
version = "0.0.0"
description = "CAREER model (forked fairseq + analysis scripts) for the LABOR-LLM replication."
requires-python = "==3.9.*"
dependencies = [
    "fairseq",
    "numpy==1.20.3",
    "scipy==1.13.0",
    "pandas==2.2.2",
    "scikit-learn==1.1.3",
    "joblib==1.2.0",
    "pyarrow==12.0.0",
    "cffi==1.15.0",
    "Cython==0.29.37",
    "ninja==1.11.1.1",
    "hydra-core==1.0.7",
    "omegaconf==2.0.6",
    "antlr4-python3-runtime==4.8",
    "sacrebleu==2.4.3",
    "regex==2023.5.5",
    "tqdm==4.66.4",
    "bitarray==2.9.2",
    "fairscale==0.4.13",
    "pytorch-lightning==1.9.0",
    "tensorboard==2.10.0",
    "tensorboardX==2.5",
    "torch==1.8.1+cu111       ; sys_platform == 'linux'",
    "torchvision==0.9.1+cu111 ; sys_platform == 'linux'",
    "torchaudio==0.8.1        ; sys_platform == 'linux'",
    "torch==1.8.1             ; sys_platform == 'darwin'",
    "torchvision==0.9.1       ; sys_platform == 'darwin'",
    "torchaudio==0.8.1        ; sys_platform == 'darwin'",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu111"
url = "https://download.pytorch.org/whl/cu111"
explicit = true

[tool.uv.sources]
fairseq     = { path = "./fairseq", editable = true }
torch       = [{ index = "pytorch-cu111", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu111", marker = "sys_platform == 'linux'" }]
